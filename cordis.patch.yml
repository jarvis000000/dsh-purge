# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

# 注意：personaSuffix 必须是空串，且全文不能出现 {{cwd}}。
# dsh >= 0.2.1-rc.2 的 agent-loop 只注册 provider / model 两个提示词变量，
# 不再有 cwd；而 system-prompt 的插值是严格的——渲染时遇到未注册变量会直接抛
# unknown prompt variable "{{cwd}}"，提示词组装在任何模型请求之前就失败，
# 每一轮都会变成 "本轮运行失败"（重启也救不回来）。
# 工作目录由官方 working-directory 服务作为 runtime context 提供，不需要重复注入。
# 插件自己也不再注册 cwd 变量（不往宿主提示词注册表里塞非官方变量）。
# 报错里的 "in section deployment:persona-suffix" 就是这一行写进去的。
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: ""

- id: dsh-purge
  inject: [systemPrompt, tools]

- insert:
    - id: dsh-purge
      name: 'dsh-purge'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true

    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
